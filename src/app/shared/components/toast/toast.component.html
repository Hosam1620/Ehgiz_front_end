<div class="toast-container position-fixed top-0 end-0 p-3" style="z-index:9999;">
  @for (toast of toastService.toasts(); track toast.id) {
    <div
      class="toast show align-items-center border-0 mb-2 shadow"
      [class.text-bg-success]="toast.type === 'success'"
      [class.text-bg-info]="toast.type === 'info'"
      [class.text-bg-warning]="toast.type === 'warning'"
      [class.text-bg-danger]="toast.type === 'error'"
      role="alert"
      aria-live="assertive"
    >
      <div class="d-flex">
        <div class="toast-body">
          <strong>{{ toast.title }}</strong>
          @if (toast.body) {
            <div class="small mt-1 opacity-75">{{ toast.body }}</div>
          }
        </div>
        <button
          type="button"
          class="btn-close btn-close-white me-2 m-auto"
          (click)="toastService.dismiss(toast.id)"
          aria-label="Close"
        ></button>
      </div>
    </div>
  }
</div>
