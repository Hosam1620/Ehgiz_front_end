<div class="toast-stack" aria-live="polite" aria-atomic="false">
  @for (toast of toastService.toasts(); track toast.id) {
    <div
      class="app-toast"
      [class.app-toast--success]="toast.type === 'success'"
      [class.app-toast--info]="toast.type === 'info'"
      [class.app-toast--warning]="toast.type === 'warning'"
      [class.app-toast--error]="toast.type === 'error'"
      [attr.role]="toast.type === 'error' ? 'alert' : 'status'"
    >
      <i
        class="app-toast-icon fas"
        [class.fa-circle-check]="toast.type === 'success'"
        [class.fa-circle-info]="toast.type === 'info'"
        [class.fa-triangle-exclamation]="toast.type === 'warning'"
        [class.fa-circle-exclamation]="toast.type === 'error'"
        aria-hidden="true"
      ></i>
      <div class="app-toast-content">
        <div class="app-toast-title">{{ toast.title }}</div>
        @if (toast.body) {
          <div class="app-toast-body">{{ toast.body }}</div>
        }
      </div>
      <button
        type="button"
        class="app-toast-close"
        (click)="toastService.dismiss(toast.id)"
        aria-label="Dismiss notification"
      >
        <i class="fas fa-xmark" aria-hidden="true"></i>
      </button>
    </div>
  }
</div>
