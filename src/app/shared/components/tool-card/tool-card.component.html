<a class="tool-card" [routerLink]="['/tools', tool().id]">
  <div class="tool-card-img">
    @if (primaryImage()) {
      <img [src]="primaryImage()!" [alt]="tool().name ?? 'Tool'" style="width:100%;height:100%;object-fit:cover;" />
    } @else {
      {{ placeholderEmoji() }}
    }
    @if (showAiMatch()) {
      <span class="chip chip-ai" style="position:absolute;top:10px;left:10px;">AI match</span>
    }
  </div>
  <div class="tool-card-body">
    <div class="tool-card-name">{{ tool().name }}</div>
    <div class="tool-card-meta">
      @if (tool().location) {
        <span>{{ tool().location }}</span>
      }
      @if (tool().condition) {
        <span> · {{ tool().condition }}</span>
      }
    </div>
    <div class="tool-card-footer">
      <div class="tool-price">{{ tool().pricePerDay | number:'1.0-0' }} EGP <span>/ day</span></div>
      <span class="chip" [class]="statusClass()">{{ statusLabel() }}</span>
    </div>
  </div>
</a>
