@if (overlay()) {
  <div
    class="position-fixed top-0 start-0 w-100 h-100 d-flex align-items-center justify-content-center bg-white bg-opacity-75"
    style="z-index: 1050;"
  >
    <div class="text-center">
      <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
        <span class="visually-hidden">{{ message() }}</span>
      </div>
      <p class="mt-3 text-muted fw-medium">{{ message() }}</p>
    </div>
  </div>
} @else {
  <div class="d-flex flex-column align-items-center justify-content-center py-5">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">{{ message() }}</span>
    </div>
    <p class="mt-3 text-muted small">{{ message() }}</p>
  </div>
}
