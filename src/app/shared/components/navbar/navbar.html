<nav class="navbar" id="main-nav">
  <a class="nav-logo" routerLink="/">
    <span class="nav-logo-badge">E</span>
    <span class="nav-logo-text">Ehgiz</span>
  </a>

  <div class="nav-links">
    <a class="nav-link" routerLink="/" [routerLinkActiveOptions]="{ exact: true }" routerLinkActive="active">Home</a>
    <a class="nav-link" routerLink="/browse" routerLinkActive="active">Browse</a>

    @if (isLoggedIn()) {
      @if (auth.isAdmin()) {
        <a class="nav-link nav-link-admin" routerLink="/admin" routerLinkActive="active">
          <i class="fas fa-shield-alt"></i> Admin
        </a>
      }
      <a class="nav-link" routerLink="/dashboard" routerLinkActive="active">Dashboard</a>

      <div class="nav-separator"></div>

      <button
        type="button"
        class="theme-toggle"
        (click)="theme.toggle()"
        [title]="theme.isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
        [attr.aria-label]="theme.isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
      >
        <i [class]="theme.isDark() ? 'fas fa-sun' : 'fas fa-moon'"></i>
      </button>

      <a class="nav-icon-btn" routerLink="/messages" routerLinkActive="active" title="Messages">
        <i class="fas fa-comment-dots"></i>
      </a>

      <app-notification-dropdown />

      <!-- User avatar dropdown -->
      <div class="nav-user">
        <button
          type="button"
          class="nav-user-trigger"
          [class.open]="menuOpen()"
          (click)="toggleMenu()"
          aria-haspopup="menu"
          [attr.aria-expanded]="menuOpen()"
        >
          <app-avatar [src]="auth.currentUser()?.profileImageUrl" [name]="userName()" [size]="32" />
          <i class="fas fa-chevron-down"></i>
        </button>

        @if (menuOpen()) {
          <div class="nav-user-menu" role="menu">
            <div class="nav-user-menu-header">
              <app-avatar [src]="auth.currentUser()?.profileImageUrl" [name]="userName()" [size]="38" />
              <div style="min-width:0;">
                <div class="nav-user-menu-name">{{ userName() }}</div>
                <div class="nav-user-menu-email">{{ auth.currentUser()?.email }}</div>
              </div>
            </div>
            <button type="button" class="nav-user-menu-item" role="menuitem" (click)="navigateTo('/profile')">
              <i class="fas fa-user-circle"></i> Profile
            </button>
            <button type="button" class="nav-user-menu-item" role="menuitem" (click)="navigateTo('/wallet')">
              <i class="fas fa-wallet"></i> Wallet
            </button>
            <button type="button" class="nav-user-menu-item" role="menuitem" (click)="navigateTo('/tools')">
              <i class="fas fa-toolbox"></i> My tools
            </button>
            <div class="nav-user-menu-divider"></div>
            <button type="button" class="nav-user-menu-item danger" role="menuitem" (click)="onLogout()">
              <i class="fas fa-sign-out-alt"></i> Logout
            </button>
          </div>
        }
      </div>
    } @else {
      <a class="nav-link" routerLink="/how-it-works" routerLinkActive="active">How it works</a>

      <button
        type="button"
        class="theme-toggle"
        (click)="theme.toggle()"
        [title]="theme.isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
        [attr.aria-label]="theme.isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
      >
        <i [class]="theme.isDark() ? 'fas fa-sun' : 'fas fa-moon'"></i>
      </button>

      <a class="nav-link" routerLink="/login" routerLinkActive="active">Login</a>
      <a class="nav-btn-primary" routerLink="/register">Sign Up</a>
    }
  </div>
</nav>
