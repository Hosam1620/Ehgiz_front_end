<nav class="navbar navbar-expand-md" id="main-nav">
  <div class="nav-logo" routerLink="/">
    <span class="nav-logo-dot"></span> Ehgiz
  </div>
  <div class="nav-search flex-grow-1 mx-4">
    <i class="fas fa-search search-icon"></i>
    <input type="text" class="form-control rounded-pill" placeholder="Search tools, drills, cameras…" style="padding-left: 40px;">
    <span class="ai-badge">AI</span>
  </div>
  <div class="nav-links d-flex align-items-center">
    <button class="nav-link" routerLink="/browse">Browse</button>
    <ng-container *ngIf="isLoggedIn; else loggedOut">
      <button class="nav-link" routerLink="/dashboard">Dashboard</button>
      <button class="nav-link" routerLink="/add-tool">List a tool</button>
      <button class="nav-icon-btn" routerLink="/messages" title="Messages">
        <i class="fas fa-comment-dots"></i>
        <span class="notif-dot"></span>
      </button>
      <button class="nav-icon-btn" routerLink="/notifications" title="Notifications">
        <i class="fas fa-bell"></i>
      </button>
      <div class="nav-avatar ms-2" routerLink="/profile" style="cursor: pointer" title="Profile">
        {{ userName ? userName.charAt(0).toUpperCase() : 'U' }}
      </div>
    </ng-container>
    <ng-template #loggedOut>
      <button class="nav-link" routerLink="/login">Login</button>
      <button class="nav-btn-primary ms-2" routerLink="/register">Sign Up</button>
    </ng-template>
  </div>
</nav>
