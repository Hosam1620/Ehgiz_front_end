@if (totalPages() > 1) {
  <div class="d-flex flex-column align-items-center gap-2">
    <nav aria-label="Page navigation">
      <ul class="pagination mb-0">
        <li class="page-item" [class.disabled]="currentPage() === 1">
          <button class="page-link" (click)="goTo(1)" [disabled]="currentPage() === 1" aria-label="First">
            &laquo;
          </button>
        </li>
        <li class="page-item" [class.disabled]="currentPage() === 1">
          <button
            class="page-link"
            (click)="goTo(currentPage() - 1)"
            [disabled]="currentPage() === 1"
            aria-label="Previous"
          >
            &lsaquo;
          </button>
        </li>

        @for (page of pages(); track $index) {
          @if (page === null) {
            <li class="page-item disabled"><span class="page-link">&hellip;</span></li>
          } @else {
            <li class="page-item" [class.active]="page === currentPage()">
              <button class="page-link" (click)="goTo(page)" [attr.aria-current]="page === currentPage() ? 'page' : null">
                {{ page }}
              </button>
            </li>
          }
        }

        <li class="page-item" [class.disabled]="currentPage() === totalPages()">
          <button
            class="page-link"
            (click)="goTo(currentPage() + 1)"
            [disabled]="currentPage() === totalPages()"
            aria-label="Next"
          >
            &rsaquo;
          </button>
        </li>
        <li class="page-item" [class.disabled]="currentPage() === totalPages()">
          <button
            class="page-link"
            (click)="goTo(totalPages())"
            [disabled]="currentPage() === totalPages()"
            aria-label="Last"
          >
            &raquo;
          </button>
        </li>
      </ul>
    </nav>

    <small class="text-muted">
      Showing {{ (currentPage() - 1) * pageSize() + 1 }}&ndash;{{ min(currentPage() * pageSize(), totalItems()) }}
      of {{ totalItems() }} items
    </small>
  </div>
}
