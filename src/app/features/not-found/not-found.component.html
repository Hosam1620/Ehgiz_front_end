<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:64vh;text-align:center;padding:40px 24px;">
  <div style="width:88px;height:88px;border-radius:50%;background:var(--green-light);color:var(--green);display:flex;align-items:center;justify-content:center;font-size:34px;margin-bottom:20px;">
    <i class="fas fa-compass"></i>
  </div>
