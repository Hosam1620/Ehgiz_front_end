<aside class="filter-panel">

  <!-- Header -->
  <div class="filter-header">
    <div style="display:flex;align-items:center;gap:8px;">
      <span class="filter-header-title">Filters</span>
      @if (activeFilterCount() > 0) {
        <span class="filter-active-badge">{{ activeFilterCount() }}</span>
      }
    </div>
    <button type="button" class="filter-reset-btn" (click)="reset()">
      <i class="fas fa-rotate-left"></i> Reset all
    </button>
  </div>

  <form [formGroup]="form">

    <!-- Search -->
    <div class="filter-section">
      <div class="filter-section-title">Search</div>
      <div class="filter-input-wrap">
        <i class="fas fa-search filter-input-icon"></i>
        <input
          type="text"
          class="form-input filter-icon-input"
          formControlName="searchTerm"
          placeholder="Tool name, brand…"
          aria-label="Search tools"
          autocomplete="off"
        />
      </div>
    </div>

    <!-- Category -->
    <div class="filter-section">
      <div class="filter-section-title">Category</div>
      <select class="form-input form-select" formControlName="categoryId" aria-label="Category">
        <option value="">All categories</option>
        @for (category of categories(); track category.id) {
          <option [value]="category.id">{{ category.name }}</option>
        }
      </select>
    </div>

    <!-- Location -->
    <div class="filter-section">
      <div class="filter-section-title">Location</div>
      <div class="filter-input-wrap">
        <i class="fas fa-map-marker-alt filter-input-icon"></i>
        <input
          type="text"
          class="form-input filter-icon-input"
          formControlName="location"
          placeholder="City or area"
          aria-label="Location"
          autocomplete="off"
        />
      </div>
    </div>

    <!-- Near me -->
    <div class="filter-section">
      <div class="filter-section-title">Distance</div>
      <div style="display:flex;gap:8px;align-items:center;">
        <button
          type="button"
          class="filter-seg-btn"
          [class.active]="nearMeActive()"
          style="flex:1;"
          [disabled]="locating()"
          (click)="toggleNearMe()"
        >
          @if (locating()) {
            <i class="fas fa-spinner fa-spin"></i> Locating…
          } @else if (nearMeActive()) {
            <i class="fas fa-location-crosshairs"></i> Near me · on
          } @else {
            <i class="fas fa-location-crosshairs"></i> Near me
          }
        </button>
        <select
          class="form-input form-select"
          style="width:auto;padding:7px 28px 7px 8px;font-size:12px;"
          aria-label="Search radius"
          [value]="selectedRadius()"
          (change)="onRadiusChange($event)"
        >
          @for (radius of radiusOptions; track radius) {
            <option [value]="radius">{{ radius }} km</option>
          }
        </select>
      </div>
      @if (nearMeActive()) {
        <div style="font-size:11px;color:var(--text-3);margin-top:6px;">Results sorted by distance</div>
      }
      @if (geoError()) {
        <div style="font-size:11px;color:var(--red);margin-top:6px;">{{ geoError() }}</div>
      }
    </div>

    <!-- Price -->
    <div class="filter-section">
      <div class="filter-section-title">
        Price per day
        <span class="filter-section-unit">EGP</span>
      </div>
      <div class="filter-price-row">
        <div class="filter-price-col">
          <label class="filter-price-label" for="filter-price-min">Min</label>
          <input
            id="filter-price-min"
            type="number"
            class="form-input"
            formControlName="minPrice"
            placeholder="0"
            min="0"
          />
        </div>
        <span class="filter-price-sep">—</span>
        <div class="filter-price-col">
          <label class="filter-price-label" for="filter-price-max">Max</label>
          <input
            id="filter-price-max"
            type="number"
            class="form-input"
            formControlName="maxPrice"
            placeholder="Any"
            min="0"
          />
        </div>
      </div>
    </div>

    <!-- Condition -->
    <div class="filter-section">
      <div class="filter-section-title">Condition</div>
      <select class="form-input form-select" formControlName="condition" aria-label="Condition">
        <option value="">All conditions</option>
        @for (option of conditionOptions; track option.name) {
          <option [value]="option.name">{{ option.label }}</option>
        }
      </select>
    </div>

    <!-- Availability -->
    <div class="filter-section">
      <div class="filter-section-title">Availability</div>
      <div class="filter-segment">
        <button
          type="button"
          class="filter-seg-btn"
          [class.active]="form.controls.availableOnly.value"
          (click)="setAvailability(true)"
        >
          <i class="fas fa-circle-check"></i> Available
        </button>
        <button
          type="button"
          class="filter-seg-btn"
          [class.active]="!form.controls.availableOnly.value"
          (click)="setAvailability(false)"
        >
          <i class="fas fa-layer-group"></i> All tools
        </button>
      </div>
    </div>

    <!-- Insurance -->
    <div class="filter-section filter-section-last">
      <label class="filter-toggle-row">
        <div class="filter-toggle-info">
          <div class="filter-toggle-label">
            <i class="fas fa-shield-halved" style="color:var(--green);font-size:12px;"></i>
            Insured tools only
          </div>
          <div class="filter-toggle-sub">Damage protection included</div>
        </div>
        <div class="filter-switch">
          <input type="checkbox" formControlName="insuredOnly" />
          <span class="filter-switch-track">
            <span class="filter-switch-thumb"></span>
          </span>
        </div>
      </label>
    </div>

  </form>

  <!-- Saved searches -->
  @if (auth.isLoggedIn()) {
    <div class="filter-section" style="border-top:1px solid var(--border);padding-top:14px;margin-top:4px;">
      <button
        type="button"
        class="btn btn-secondary btn-sm"
        style="width:100%;"
        [disabled]="isSavingSearch()"
        (click)="saveCurrentSearch()"
      >
        @if (isSavingSearch()) {
          <i class="fas fa-spinner fa-spin"></i> Saving…
        } @else {
          <i class="fas fa-bookmark"></i> Save this search
        }
      </button>
      <a
        routerLink="/saved-searches"
        style="display:block;text-align:center;font-size:12px;color:var(--green);margin-top:8px;text-decoration:none;"
      >Manage saved searches</a>
    </div>
  }
</aside>
