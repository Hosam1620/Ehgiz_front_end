<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Ehgiz — P2P Tool Rental Platform</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Ehgiz — Egypt's peer-to-peer tool rental platform. Rent tools from neighbors or earn by listing your own.">
  <meta name="theme-color" content="#1A6B4A">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Fraunces:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script>
    // Apply the persisted theme before Angular boots to avoid a flash of the wrong palette.
    (function () {
      try {
        var stored = localStorage.getItem('ehgiz_theme');
        var theme = (stored === 'dark' || stored === 'light')
          ? stored
          : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) { /* default to light */ }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
